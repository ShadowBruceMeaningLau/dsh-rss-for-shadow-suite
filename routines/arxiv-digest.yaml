name: arxiv-digest
schedule: '30 9 * * *'
timezone: Asia/Shanghai
profile: headless
cwd: 'D:/Obsidian本地库/书籍管理'
overlap: skip
timeoutMin: 25
prompt: |
  用 rss_fetch 工具抓取全部 category=论文 的 arXiv 订阅源（cs.AI / cs.LG / cs.CL / cs.SE / math / math-ph / hep-th / cond-mat / gr-qc / physics / quant-ph），筛选最近 24 小时内发布的新论文，输出一份中文《论文速递》（Markdown 格式）：
  1. 按方向分组：AI 与机器学习（cs.AI/cs.LG/cs.CL）、计算机系统与软件（cs.SE）、数学（math/math-ph）、物理（hep-th/cond-mat/gr-qc/physics/quant-ph）
  2. 每个方向挑 3-5 篇（共 15-20 篇），每篇给出：中文标题意译 + 一句话讲清楚做什么 + arXiv 链接
  3. 全领域选一篇「今日推荐」，标注并附一句推荐理由
  全文控制在 1000 字以内；标题给出原文标题与 arXiv 编号。
  最后用 write 工具把简报全文写入工作区内的 RSS订阅/论文速递-YYYY-MM-DD.md（YYYY-MM-DD 用今天的日期，覆盖同名旧文件）。